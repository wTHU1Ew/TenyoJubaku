# TenyoJubaku Configuration Template
# Copy this file to config.yaml and fill in your actual values
# NEVER commit config.yaml to version control!

# OKX API Configuration
okx:
  # API endpoint (production or demo)
  api_url: "https://www.okx.com"

  # Your OKX API credentials
  # Get these from: OKX Account > API Management
  # Required permissions: Read (trading permissions NOT required for monitoring)
  api_key: "your-api-key-here"
  api_secret: "your-api-secret-here"
  passphrase: "your-api-passphrase-here"

  # Request timeout in seconds
  timeout: 30

  # Maximum retry attempts for failed requests
  max_retries: 3

  # Enable debug mode to print all OKX API requests and responses to console
  # This is useful for troubleshooting API issues
  # WARNING: Sensitive data (API keys) are NOT masked in debug output
  debug_enable: false

# Monitoring Configuration
monitoring:
  # Monitoring interval in seconds (how often to fetch account data)
  interval: 60

  # Enable monitoring on startup
  enabled: true

# Database Configuration
database:
  # Path to SQLite database file
  path: "./data/tenyojubaku.db"

  # Enable Write-Ahead Logging (WAL) mode for better concurrency
  wal_mode: true

  # Connection pool settings
  max_open_conns: 1
  max_idle_conns: 1

# Logging Configuration
logging:
  # Log file path
  file_path: "./logs/app.log"

  # Log level: DEBUG, INFO, WARN, ERROR
  level: "INFO"

  # Maximum log file size in MB before rotation
  max_size: 100

  # Maximum number of days to retain old log files
  max_age: 30

  # Maximum number of old log files to keep
  max_backups: 10

  # Compress rotated log files
  compress: true

  # Log to console in addition to file
  console: true

# TPSL Management Configuration
tpsl:
  # Enable automatic TPSL management
  # When enabled, the system will automatically place stop-loss and take-profit orders
  # for positions that don't have adequate TPSL coverage
  enabled: true

  # TPSL check interval in seconds (how often to check positions and place orders)
  # Default: 300 seconds (5 minutes)
  # Lower values = faster response but more API calls
  # Higher values = slower response but fewer API calls
  check_interval: 300

  # Volatility percentage for stop-loss calculation (e.g., 0.01 = 1%)
  # This is the base risk percentage (NOT adjusted by leverage)
  # Formula: SL_distance = entry_price × volatility_pct
  # Example: For entry price $100, volatility 1%:
  #   - Long position: SL = $99 (1% below entry)
  #   - Short position: SL = $101 (1% above entry)
  # Default: 0.01 (1%)
  volatility_pct: 0.01

  # Profit-loss ratio for take-profit calculation (e.g., 5.0 = 5:1 ratio)
  # Formula: TP_distance = entry_price × volatility_pct × profit_loss_ratio
  # Example: For entry price $100, volatility 1%, ratio 5:1:
  #   - Long position: TP = $105 (5% above entry)
  #   - Short position: TP = $95 (5% below entry)
  # Default: 5.0 (5:1 ratio)
  #
  # Note: TP and SL are placed as TWO SEPARATE ORDERS to ensure both work correctly
  # (OKX API limitation: when both parameters sent together, only SL may execute)
  profit_loss_ratio: 5.0

# Dynamic Trailing Stop-Loss Configuration (Feature 5 - V5.1 Two-Phase Algorithm)
# V5.1 implements leverage-aware, two-phase dynamic stop-loss:
#   Phase A: Gradual move to breakeven (leverage-aware thresholds)
#   Phase B: Trailing mode (only after breakeven is reached)
dynamic_sl:
  # Enable dynamic trailing stop-loss functionality
  # When enabled, the system will automatically adjust stop-loss orders
  # as the position becomes more profitable, locking in gains
  enabled: false

  # ===== Phase A: Gradual Move to Breakeven (Leverage-Aware) =====
  # Phase A triggers when account profit reaches threshold and gradually moves SL toward breakeven

  # Account profit threshold base percentage (e.g., 0.01 = 1%)
  # Actual threshold = profit_step_pct × leverage
  # When account profit reaches this threshold, trigger SL move toward breakeven
  # Example: For 10x leverage, profit_step_pct = 0.01:
  #   - Threshold = 1% × 10 = 10% account profit
  #   - At 10% account profit, SL starts moving toward breakeven
  # Default: 0.01 (1% base)
  profit_step_pct: 0.01

  # SL move step base percentage (e.g., 0.0101 = 1.01%)
  # Actual SL move = sl_move_step_pct × leverage
  # How much to move SL toward breakeven on each Phase A trigger
  # Should be >= profit_step_pct to ensure progress toward breakeven
  # Example: For 10x leverage, sl_move_step_pct = 0.0101:
  #   - SL moves by 1.01% × 10 = 10.1% toward breakeven
  # Default: 0.0101 (1.01% base)
  sl_move_step_pct: 0.0101

  # ===== Phase B: Trailing Mode (Only After Breakeven) =====
  # Phase B activates only after SL has reached breakeven (entry ± 0.1%)
  # Then follows the standard trailing logic for locking in additional gains

  # Trailing step percentage (e.g., 0.005 = 0.5%)
  # The price increment that triggers SL adjustment evaluation in Phase B
  # Smaller values = more frequent SL updates but more API calls
  # Larger values = fewer updates but larger risk of profit giveback
  # Example: trailing_step_pct = 0.005 means check every 0.5% price move
  # Default: 0.005 (0.5%)
  trailing_step_pct: 0.005

  # Stop-loss move step percentage (e.g., 0.001 = 0.1%)
  # How much to move the stop-loss on each Phase B adjustment
  # Should be smaller than trailing_step_pct to allow profit lock-in
  # Example: For current price $110, stop_move_step_pct = 0.001:
  #   - Move SL up by $0.11 (0.1% of $110)
  # Default: 0.001 (0.1%)
  # Note: stop_move_step_pct should be < trailing_step_pct
  stop_move_step_pct: 0.001

  # ===== V5.1 Algorithm Summary =====
  # Example with 10x leverage, entry at $100:
  #   Initial state: SL at $98 (2% below entry)
  #
  #   Phase A (Moving to Breakeven):
  #     - When account profit >= 10% (i.e., price at $101 for long)
  #     - SL moves by 10.1% → from $98 to ~$107.88 (capped at $100.10 breakeven)
  #     - Breakeven reached! Transition to Phase B
  #
  #   Phase B (Trailing):
  #     - Every 0.5% price gain → SL moves up 0.1%
  #     - At $105: SL trails to $100.20
  #     - At $110: SL trails to $100.70
  #
  # For lower leverage (e.g., 2x):
  #   - Threshold = 1% × 2 = 2% account profit
  #   - SL moves by 1.01% × 2 = 2.02% per trigger
  #   - May require multiple Phase A moves before reaching breakeven
